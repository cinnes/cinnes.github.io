<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Personal Site</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        color: #333;
      }
      h1 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 0.5rem;
      }
      .hero {
        text-align: center;
        margin: 3rem 0;
      }
      .contact {
        background: #f8f9fa;
        padding: 1.5rem;
        border-radius: 8px;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Welcome to My Personal Site</h1>
      <p>This is your GitHub Pages site. Edit this file to customize it!</p>
    </div>

    <section>
      <h2>About</h2>
      <p>Add information about yourself here.</p>
    </section>

    <section>
      <h2>Projects</h2>
      <p>Showcase your projects and work here.</p>
    </section>

    <div class="contact">
      <h2>Contact</h2>
      <p>Add your contact information or links here.</p>
    </div>
  </body>
</html>
