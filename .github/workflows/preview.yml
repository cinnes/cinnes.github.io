name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Preview
        id: preview
        run: |
          npm install -g surge
          PREVIEW_URL="cinnes-pr-${{ github.event.pull_request.number }}.surge.sh"
          surge --project ./out --domain $PREVIEW_URL --token ${{ secrets.SURGE_TOKEN }}
          echo "preview_url=https://$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = "${{ steps.preview.outputs.preview_url }}";

            // Get all comments on the PR
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Find and delete previous preview comments from this bot
            for (const comment of comments) {
              if (
                comment.user.type === 'Bot' &&
                comment.body.includes('Preview deployment complete')
              ) {
                await github.rest.issues.deleteComment({
                  comment_id: comment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              }
            }

            // Create new preview comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployment complete\n\n[View Live Preview](${previewUrl})`
            });
